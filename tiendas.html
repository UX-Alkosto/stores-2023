<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet"
        href="https://media.aws.alkomprar.com/resources/assets/common/wro/alkomprar_critical.min.css?v=2026-01-v10.2.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/UX-Alkosto/stores-2023/css/tiendas.min.css">
    <!-- <link rel="stylesheet" href="./css/tiendas.css"> -->
    <link rel="preconnect" href="https://feeds.datafeedwatch.com">

<body>
    <main>
        <section id="cont-principal">
            <div class="container-fluid bg-gray">
                <div class="container">
                    <div class="row">
                        <div class="col-md-12 title">
                            <div class="cont-title">
                                <h1>Nuestras tiendas</h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container-fluid">
                <div class="container">
                    <div class="row">
                        <div class="col-md-6 col-md-offset-3 cont-buscador">
                            <div class="cont-input">
                                <div class="buscador">
                                    <label for="search" class="label-float">Busca tu
                                        tienda</label>
                                    <input autocomplete="off" style="width: 100%;" class="input-search form-control"
                                        type="text" name="search" id="search"
                                        placeholder="Ingresa el nombre de tu municipio">
                                    <span id="cont-input">
                                        <i class="alk-icon-search-mobile icon-search"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="dropdown-show col-xs-12 col-sm-12 col-md-6 col-md-offset-3" id="listaCoincidencias">
                        </div>
                        <div class="col-md-12">
                            <h2>Ciudades principales</h2>
                            <div class="badges" id="cont-badge-city"></div>
                        </div>

                    </div>
                </div>
                <div class="container">
                    <div class="row">
                        <div class="col-md-12" id="result-search">
                        </div>
                    </div>
                    <div class="row" id="content">
                        <div class="col-sm-6 col-md-4">
                            <div class="card skeleton">
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <div class="card skeleton">
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <div class="card skeleton">
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <div class="card skeleton">
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <div class="card skeleton">
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <div class="card skeleton">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container-fluid" id="cont-carrusel">
                <div class="container">
                    <div class="row">
                    </div>

                </div>
        </section>
    </main>
    <style>
              
        /* SELECCIONAR ESTILO POR CADA TIENDA Y ELIMINAR EL QUE NO CORRESPONDE. */

        /* Alkosto */

        .cont-no-results img {
            filter: hue-rotate(125deg) brightness(100%);
        }

        /* ktronix */
        .accordion-button::before {
            filter: hue-rotate(-28deg) brightness(100%);
        }

        .cont-no-results img {
            filter: hue-rotate(-20deg) brightness(100%);
        }


        /* alkomprar */
        .accordion-button::before {
            filter: hue-rotate(75deg) brightness(100%);
        }

        .cont-no-results img {
            filter: hue-rotate(-140deg) brightness(100%);
        }

        span.badge.bg-primary {
            background-color: var(--breadcrumb-root);
            border-color: var(--breadcrumb-root);
        }

        /* Estilos badges tiendas */        

        .badges .badges_item {
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .badges .badges_item_text {
            min-height: 22px;
            display: -ms-flexbox;
            display: -ms-flex;
            display: -webkit-box;
            display: flex;
            -ms-align-items: center;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            padding: 0 8px;
        }

        .badges .badges_item {
            border: 1px solid var(--link-text-color);
            border-radius: 4px;
            margin-right: 4px;
            font-size: 14px;
            color: var(--link-text-color);
            white-space: nowrap;
            margin-bottom: 4px;
        }

        .badges .badges_item:hover {
            border-color: var(--icon-alternative-color1);
            color: var(--icon-alternative-color1);
        }

        .badge-selected-cyd {
            background-color: #E3F5E4;
            color: var(--primary-color1);
            font-weight: 700;
        }
       
    </style>

    <script>        
        var v = new Date().toISOString().replace(/\D/g, '').slice(0, 12);        
        document.write('<script src="https://media.aws.alkomprar.com/ymarketingcolcomercio/devs/transversal/tiendas/stores.min.js?v' + v + '"><\/script>');
        document.write('<rel="stylesheet" href="https://media.aws.alkomprar.com/ymarketingcolcomercio/devs/transversal/tiendas/tiendas.css?v' + v + '">');
    </script>

    <script src="./js/tiendas copy.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js" defer=""
        crossorigin="anonymous"></script> -->
</body>

</html>
