    <style>
        /* Skeleton */
        .skeleton {
            background-color: #e0e0e0;
            /* Color de fondo simulando el anuncio */
            animation: shimmer 1.5s infinite linear;
            /* Animación de parpadeo. Indica al navegador que elemento va a cambiar para reservar espacio */
            will-change: background;
            /* Reservar espacio en el flujo normal del documento */
            position: relative;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .skeleton::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 1000px 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        @media(max-width: 767px) {
            .skeleton {
                height: 184px;
            }
        }

        @media(min-width: 768px) {
            .skeleton {
                height: 212px;
            }
        }

        /* SELECCIONAR ESTILO POR CADA TIENDA Y ELIMINAR EL QUE NO CORRESPONDE. */
