    <style>
        .container-fluid {
            place-self: auto !important;
        }

        .ciudad-tienda {
            font-weight: 600;
        }

        /* Skeleton */
        .skeleton {
            background-color: #e0e0e0;
            /* Color de fondo simulando el anuncio */
            animation: shimmer 1.5s infinite linear;
            /* Animación de parpadeo. Indica al navegador que elemento va a cambiar para reservar espacio */
            will-change: background;
            /* Reservar espacio en el flujo normal del documento */
            position: relative;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .skeleton::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 1000px 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        @media(max-width: 767px) {
            .skeleton {
                height: 184px;
            }
        }

        @media(min-width: 768px) {
            .skeleton {
                height: 212px;
            }
        }

        /* SELECCIONAR ESTILO POR CADA TIENDA Y ELIMINAR EL QUE NO CORRESPONDE. */

        /* Alkosto */

        .cont-no-results img {
            filter: hue-rotate(125deg) brightness(100%);
        }

        /* ktronix */
        .accordion-button::before {
            filter: hue-rotate(-28deg) brightness(100%);
        }

        .cont-no-results img {
            filter: hue-rotate(-20deg) brightness(100%);
        }


        /* alkomprar */
        .accordion-button::before {
            filter: hue-rotate(75deg) brightness(100%);
        }

        .cont-no-results img {
            filter: hue-rotate(-140deg) brightness(100%);
        }

        span.badge.bg-primary {
            background-color: var(--breadcrumb-root);
            border-color: var(--breadcrumb-root);
        }

        /* Estilos badges tiendas */

        #cont-badge-city {
            white-space: nowrap;
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
            mask-image: linear-gradient(to right, transparent 0%,
                    /* Izquierda transparente (inicio del fade) */
                    black 2%,
                    /* Después del 2%, opaco */
                    black 98%,
                    /* Hasta el 98%, opaco */
                    transparent 100%
                    /* Derecha transparente (fin del fade) */
                );
            padding: 0 24px;
        }

        .badges .badges_item {
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .badges .badges_item_text {
            min-height: 22px;
            display: -ms-flexbox;
            display: -ms-flex;
            display: -webkit-box;
            display: flex;
            -ms-align-items: center;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            padding: 0 8px;
        }

        .badges .badges_item {
            border: 1px solid var(--link-text-color);
            border-radius: 4px;
            margin-right: 4px;
            font-size: 14px;
            color: var(--link-text-color);
            white-space: nowrap;
            margin-bottom: 4px;
        }

        .badges .badges_item:hover {
            border-color: var(--icon-alternative-color1);
            color: var(--icon-alternative-color1);
        }

        .badge-selected-cyd {
            background-color: #E3F5E4;
            color: var(--primary-color1);
            font-weight: 700;
        }
    </style>
